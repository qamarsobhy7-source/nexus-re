name: NEXUS-RE CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify toolkit loads
        run: python -c "import importlib.util; spec = importlib.util.spec_from_file_location('nexus', 'nexus_re_v3.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('OK:', hasattr(m, 'full_analysis'))"

      - name: Verify README exists
        run: test -f README.md && echo "README OK"

      - name: Verify proposal exists
        run: test -f proposal.md && echo "Proposal OK"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 nexus_re_v3.py --max-line-length=120 --ignore=E501,W503,E203 || true

      - name: Check formatting
        run: black --check nexus_re_v3.py || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r nexus_re_v3.py -ll || true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t nexus-re:test .

      - name: Test Docker image
        run: docker run --rm nexus-re:test python -c "print('Docker build OK')"