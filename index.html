<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS-RE — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
  body { font-family: 'Cairo', sans-serif; background-color: #0A0E27; color: #E0E0E0; }
  .glass { background: rgba(26, 31, 58, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(108, 99, 255, 0.2); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0A0E27; }
  ::-webkit-scrollbar-thumb { background: #6C63FF; border-radius: 4px; }
</style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="glass px-6 py-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-shield-halved text-3xl" style="color: #6C63FF;"></i>
      <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-[#6C63FF] to-[#00FF88]">NEXUS-RE</h1>
    </div>
    <div class="flex items-center space-x-4">
      <button onclick="exportPDF()" class="text-sm bg-[#1a1f3a] px-3 py-1 rounded border border-[#00FF88] hover:bg-[#00FF88] hover:text-black transition">
        <i class="fa-solid fa-file-pdf"></i> PDF
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-64 glass border-r border-[#1a1f3a] overflow-y-auto hidden md:block">
      <div class="p-4">
        <h2 class="text-lg font-semibold text-[#00FF88] mb-4 border-b border-[#1a1f3a] pb-2">Tools (31)</h2>
        <ul class="space-y-2 text-sm" id="tools-sidebar"></ul>
      </div>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto">
      <div class="glass rounded-xl p-6 mb-6">
        <h2 class="text-xl font-semibold text-[#6C63FF] mb-4">Analysis Input</h2>
        <div class="flex flex-col space-y-4">
          <textarea id="inputData" rows="3" class="w-full bg-[#050810] border border-[#1a1f3a] rounded p-3 text-sm focus:outline-none focus:border-[#6C63FF] font-mono text-[#00FF88]" placeholder="Enter Hex string (e.g., 7f454c46...) or Text..."></textarea>
          <button onclick="runAnalysis()" class="bg-gradient-to-r from-[#6C63FF] to-[#8a63ff] text-white font-bold py-3 px-6 rounded shadow-lg hover:opacity-90 transition">
            <i class="fa-solid fa-microscope"></i> Run Analysis
          </button>
        </div>
      </div>

      <div id="results" class="hidden space-y-6">
        <div class="glass rounded-xl p-6">
          <h2 class="text-xl font-semibold text-[#00FF88] mb-4"><i class="fa-solid fa-clipboard-check"></i> Evidence Panel</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="border-b border-[#1a1f3a]">
                <tr><th class="py-2">Tool</th><th class="py-2">Result</th><th class="py-2">Confidence</th></tr>
              </thead>
              <tbody id="evidence-table" class="text-gray-400"></tbody>
            </table>
          </div>
        </div>

        <div class="glass rounded-xl p-6">
          <h2 class="text-xl font-semibold text-red-500 mb-4"><i class="fa-solid fa-triangle-exclamation"></i> Vulnerabilities</h2>
          <div id="vuln-cards" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div class="glass rounded-xl p-6">
          <h2 class="text-xl font-semibold text-[#6C63FF] mb-4"><i class="fa-solid fa-code"></i> Code Viewer</h2>
          <pre class="bg-[#050810] rounded p-4 overflow-x-auto"><code class="language-c" id="code-viewer">// No code extracted</code></pre>
        </div>
      </div>
    </main>
  </div>

  <script>
    const toolsList = ["Hex Dump", "Extract Strings", "Calculate Hash", "Calculate Entropy", "Detect File Type", "File Info", "Parse ELF Header", "Parse PE Header", "Extract IOCs", "XOR Brute Force", "Scan Suspicious APIs", "Detect Packer", "YARA Scan", "Full Analysis", "Version Diff", "Section Analyzer", "Base64 Detector", "String Similarity", "PE Section Analyzer", "ELF Section Analyzer", "Import Table Parser", "Export Table Parser", "Anti-Debug Detector", "Crypto Scanner", "Obfuscation Detector", "APK Manifest Parser", "Certificate Extractor", "Deep Packer Scanner"];
    
    const sidebar = document.getElementById('tools-sidebar');
    toolsList.forEach((tool, i) => {
      sidebar.innerHTML += `<li class="p-2 rounded hover:bg-[#1a1f3a] cursor-pointer flex justify-between" onclick="fillInput('${tool}')"><span>${tool}</span><span class="text-[#00FF88] text-xs">${i+1}</span></li>`;
    });

    function fillInput(tool) {
      document.getElementById('inputData').value = (tool === "Parse ELF Header") ? "7f454c4602010100000000000000000002003e00010000000010400000000000" : "7f454c46...";
    }

    function runAnalysis() {
      const input = document.getElementById('inputData').value.trim();
      if (!input) { alert("Please enter data"); return; }
      const btn = event.target;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Analyzing...';
      
      setTimeout(() => {
        const evidence = [
          { tool: "detect_file_type_hex", result: "ELF (Linux) Executable", conf: "HIGH" },
          { tool: "parse_elf_header", result: "Class: 64-bit, Arch: x86-64", conf: "HIGH" },
          { tool: "calculate_entropy", result: "Entropy: 3.66 (LOW)", conf: "HIGH" }
        ];
        const vulns = [
          { title: "Buffer Overflow", desc: "Unchecked input in parse function.", sev: "Critical" },
          { title: "Hardcoded String", desc: "Password found in plain text.", sev: "High" }
        ];

        document.getElementById('evidence-table').innerHTML = evidence.map(e => `<tr class="border-b border-[#1a1f3a]"><td class="py-2 font-mono text-[#6C63FF]">${e.tool}</td><td class="py-2">${e.result}</td><td class="py-2"><span class="px-2 py-1 rounded text-xs bg-green-900 text-green-300">${e.conf}</span></td></tr>`).join('');
        
        document.getElementById('vuln-cards').innerHTML = vulns.map(v => {
          const color = v.sev === 'Critical' ? 'red' : 'yellow';
          return `<div class="border-l-4 border-${color}-500 bg-[#1a1f3a] p-4 rounded"><h3 class="font-bold text-${color}-400">${v.title}</h3><p class="text-sm text-gray-400">${v.desc}</p></div>`;
        }).join('');

        document.getElementById('code-viewer').innerText = `int check_license(char *key) {
    char valid_key[] = "ABCD1234";
    return strcmp(key, valid_key) == 0;
}`;
        Prism.highlightAll();
        
        document.getElementById('results').classList.remove('hidden');
        btn.innerHTML = '<i class="fa-solid fa-microscope"></i> Run Analysis';
      }, 1000);
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("NEXUS-RE Report", 10, 10);
      doc.save("report.pdf");
    }
  </script>
</body>
</html>
