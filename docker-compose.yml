version: "3.9"

# NEXUS-RE has ZERO runtime dependencies.
# No database, no cache, no message queue needed.
# The API runs on pure Python stdlib (http.server).

services:
  nexus-re:
    build: .
    image: nexus-re:latest
    container_name: nexus-re
    volumes:
      - ./samples:/samples:ro
      - ./reports:/reports
    environment:
      - NEXUS_LOG_LEVEL=INFO
    stdin_open: true
    tty: true
    restart: unless-stopped

  nexus-api:
    build: .
    image: nexus-re:latest
    container_name: nexus-api
    command: python api_render.py
    ports:
      - "8000:8000"
    environment:
      - NEXUS_LOG_LEVEL=INFO
      - PORT=8000
    restart: unless-stopped

networks:
  default:
    name: nexus-network
